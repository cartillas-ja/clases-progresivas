<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clases Progresivas</title>
<meta name="theme-color" content="#071A3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#071A3D; --navy-800:#0B2452; --navy-700:#143a7a;
    --rojo:#D6180A; --rojo-700:#A81212; --oro:#F2B705; --oro-300:#FFD766; --verde:#2E9E5B; --ambar:#E08A00;
    --crema:#F5F1E6; --crema-2:#ECE3CD; --panel:#FBF8F0;
    --ink:#16223f; --ink-soft:#586178; --line:rgba(20,30,60,.10);
    --c-amigo:#1F7AE0; --c-companero:#D6180A; --c-explorador:#2E9E5B; --c-orientador:#64748B; --c-viajero:#7D1F3D; --c-guia:#F5C518;
    --disp:"Big Shoulders Display",sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"Space Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{font-family:var(--body); color:var(--ink); background:var(--crema); -webkit-font-smoothing:antialiased}
  button{font-family:var(--body); cursor:pointer}
  .hidden{display:none !important}

  /* ---------- LOGIN (estilo portada) ---------- */
  #login{position:relative; min-height:100vh; display:grid; place-items:center; padding:30px 16px; overflow:hidden;
    background:radial-gradient(1100px 620px at 50% 2%,#133a74 0%,#0a2251 42%,#061631 100%)}
  /* brújula girando */
  #login .halo{position:absolute; top:50%; left:50%; width:min(680px,135vw); height:min(680px,135vw); transform:translate(-50%,-52%); z-index:0; pointer-events:none}
  #login .halo svg{width:100%; height:100%; display:block; opacity:.5}
  #login .compass{transform-origin:50% 50%; animation:spin 120s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ #login .compass{animation:none} }
  /* contornos suaves */
  #login .contours{position:absolute; inset:0; z-index:0; opacity:.4; pointer-events:none}
  .card-login{position:relative; z-index:2; width:100%; max-width:372px; text-align:center; color:#fff}
  .card-login .flame{height:36px; margin-bottom:6px; filter:drop-shadow(0 3px 9px rgba(0,0,0,.55))}
  .card-login .inst{font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:#aebfde; margin-bottom:12px}
  .card-login .emblema-wrap{position:relative; display:inline-block; margin:2px 0 4px}
  .card-login .emblema-wrap::before{content:""; position:absolute; inset:-20px; border-radius:50%; background:radial-gradient(circle,rgba(242,183,5,.30),transparent 68%); z-index:-1}
  .card-login .emblema{width:96px; height:auto; filter:drop-shadow(0 10px 20px rgba(0,0,0,.55))}
  .card-login .rule{width:42px; height:2px; background:var(--oro); margin:12px auto 9px; border-radius:2px}
  .card-login h1{font-family:var(--disp); font-weight:900; font-size:38px; line-height:.84; margin:0; letter-spacing:.02em}
  .card-login .sub{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:#c9d6ef; margin-top:9px}
  .form{margin-top:24px; text-align:left}
  .field{margin-bottom:13px}
  .field label{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#9fb2d6; margin:0 0 6px 2px}
  .inp{display:flex; align-items:center; gap:9px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:0 13px; transition:.15s}
  .inp:focus-within{border-color:var(--oro-300); background:rgba(255,255,255,.1)}
  .inp input, .inp select{flex:1; background:transparent; border:none; outline:none; color:#fff; font-family:var(--body); font-size:15px; padding:13px 0}
  .inp input::placeholder{color:#6f83a8}
  .inp select option{color:#000}
  .btn-main{width:100%; border:none; margin-top:6px; font-weight:700; font-size:15px; padding:15px; border-radius:13px;
    background:linear-gradient(180deg,var(--oro-300),var(--oro)); color:#3a2a00; box-shadow:0 12px 26px -10px rgba(242,183,5,.6)}
  .btn-main:active{transform:translateY(1px)}
  .err{color:#ffb3ab; font-size:12.5px; margin-top:10px; min-height:16px}
  .switch{margin-top:18px; font-size:12.5px; color:#9fb2d6}
  .switch a{color:var(--oro-300); text-decoration:none; cursor:pointer; font-weight:600}
  .seedhint{margin-top:22px; font-family:var(--mono); font-size:10px; color:#6f83a8; line-height:1.7; border-top:1px solid rgba(255,255,255,.1); padding-top:12px}

  /* ---------- APP CHROME ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column}
  .chrome{position:sticky; top:0; z-index:20; background:linear-gradient(100deg,var(--navy-900),var(--navy-800)); color:#fff; border-bottom:1px solid rgba(255,255,255,.08)}
  .chrome-in{max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:11px 18px}
  .chrome .brand{display:flex; align-items:center; gap:9px; min-width:0}
  .chrome .brand img{height:26px}
  .chrome .brand b{font-family:var(--disp); font-weight:800; letter-spacing:.04em; font-size:15px; white-space:nowrap}
  .chrome .me{margin-left:auto; display:flex; align-items:center; gap:10px}
  .chrome .me .nm{text-align:right; line-height:1.15}
  .chrome .me .nm b{font-size:12.5px; font-weight:600; display:block}
  .chrome .me .nm span{font-size:10px; color:#9fb2d6}
  .chrome .me .av{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-family:var(--disp); font-weight:800; font-size:14px; color:#fff; background:linear-gradient(140deg,#2b4a78,#16314f)}
  .logout{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:#cdd9f0; font-size:11px; font-weight:600; padding:7px 11px; border-radius:9px}
  main{max-width:1100px; width:100%; margin:0 auto; padding:20px 18px 48px; flex:1}

  .phead{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px}
  .phead h1{font-family:var(--disp); font-weight:800; font-size:27px; margin:0; line-height:1}
  .phead p{margin:4px 0 0; color:var(--ink-soft); font-size:13px}
  .rolechip{font-family:var(--mono); font-size:10px; padding:5px 10px; border-radius:999px; font-weight:700; background:rgba(20,30,60,.06); color:var(--ink-soft)}
  .phead .act{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
  .btn{border:none; font-weight:600; font-size:12.5px; padding:9px 14px; border-radius:10px; display:inline-flex; align-items:center; gap:6px}
  .btn .pl{font-size:15px; line-height:0; font-weight:700}
  .btn.red{background:linear-gradient(180deg,#e8362a,var(--rojo)); color:#fff}
  .btn.gold{background:linear-gradient(180deg,var(--oro-300),var(--oro)); color:#3a2a00}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}
  .btn.sm{font-size:11.5px; padding:7px 11px}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:11px; margin-bottom:18px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:13px 14px}
  .kpi .n{font-family:var(--mono); font-weight:700; font-size:24px; line-height:1}
  .kpi .n small{font-size:13px; color:var(--ink-soft)}
  .kpi .l{font-size:11px; color:var(--ink-soft); margin-top:5px}
  .kpi.hl{color:#fff; border:none}
  .kpi.hl.gold{background:linear-gradient(150deg,#caa000,#8a6a00)}
  .kpi.hl.red{background:linear-gradient(150deg,var(--rojo),var(--rojo-700))}
  .kpi.hl .l{color:rgba(255,255,255,.85)}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:15px; overflow:hidden; margin-bottom:15px}
  .card>h2{font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.02em; margin:0; padding:14px 16px 11px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:8px}
  .card>h2 .mut{font-family:var(--mono); font-size:10px; color:var(--ink-soft); font-weight:400}
  .empty{padding:22px 16px; text-align:center; color:var(--ink-soft); font-size:13px}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th{text-align:left; font-family:var(--mono); font-weight:400; font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); padding:9px 14px}
  td{padding:10px 14px; border-top:1px solid var(--line); vertical-align:middle}
  td b{font-weight:600}
  .bar{height:7px; border-radius:6px; background:var(--crema-2); overflow:hidden; min-width:60px}
  .bar i{display:block; height:100%; border-radius:6px; background:var(--oro)}
  .pct{font-family:var(--mono); font-size:11px; color:var(--ink-soft)}
  .chip-cls{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; white-space:nowrap}
  .chip-cls i{width:10px; height:10px; border-radius:50%; flex:none}
  .badge{font-family:var(--mono); font-size:9.5px; padding:4px 9px; border-radius:999px; font-weight:700; white-space:nowrap}
  .bg-ok{background:rgba(46,158,91,.15); color:var(--verde)}
  .bg-mut{background:rgba(20,30,60,.08); color:var(--ink-soft)}

  .sol{display:flex; align-items:center; gap:11px; padding:12px 15px; border-top:1px solid var(--line)}
  .sol:first-of-type{border-top:none}
  .sol .av2{width:36px; height:36px; border-radius:10px; background:linear-gradient(140deg,#4d7c9d,#2c4d64); color:#fff; display:grid; place-items:center; font-family:var(--disp); font-weight:800; font-size:14px; flex:none}
  .sol .info{flex:1; min-width:0}
  .sol .info b{font-size:13px; font-weight:600; display:block}
  .sol .info span{font-size:11px; color:var(--ink-soft); font-family:var(--mono)}
  .sol .acts{display:flex; gap:6px}
  .mini{border:1px solid var(--line); background:#fff; font-size:11px; font-weight:600; padding:7px 11px; border-radius:8px}
  .mini.ap{border:none; background:linear-gradient(180deg,#43c47a,var(--verde)); color:#fff}
  .mini.rj{color:var(--rojo-700); border-color:rgba(214,24,10,.4)}

  /* acordeón director club */
  .clsgroup{border-top:1px solid var(--line)}
  .clsgroup:first-child{border-top:none}
  .clsgh{display:flex; justify-content:space-between; align-items:center; padding:10px 15px; background:rgba(20,30,60,.03)}
  .clsgh .mut{font-family:var(--mono); font-size:10px; color:var(--ink-soft)}
  .krow{width:100%; display:flex; align-items:center; gap:10px; padding:11px 15px; background:#fff; border:none; border-top:1px solid var(--line); text-align:left}
  .krow:hover{background:rgba(20,30,60,.025)}
  .chev{color:var(--ink-soft); font-size:10px; width:12px; flex:none}
  .kn{font-size:13px; font-weight:600; flex:1; color:var(--ink); min-width:0}
  .kbar{width:90px; height:7px; border-radius:6px; background:var(--crema-2); overflow:hidden; flex:none}
  .kbar i{display:block; height:100%; border-radius:6px}
  .kp{font-family:var(--mono); font-size:11px; color:var(--ink-soft); width:36px; text-align:right}
  .kdetail{display:none; padding:6px 15px 12px 38px; background:rgba(20,30,60,.015)}
  .kdetail.open{display:block}
  .grphd{display:flex; align-items:center; gap:8px; margin:11px 0 5px; font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; font-weight:700}
  .grphd:first-child{margin-top:4px}
  .grphd.comunes{color:#2c536f}
  .grphd.avanzados{color:var(--ambar)}
  .grphd::after{content:""; flex:1; height:1px; background:var(--line)}
  .grphd .gp{font-family:var(--mono); font-size:9.5px; letter-spacing:0; text-transform:none}
  .secrow{display:flex; align-items:center; gap:9px; margin:6px 0}
  .secrow .sl{width:130px; font-size:11.5px; color:var(--ink-soft); flex:none}
  .secrow .sbar{flex:1; height:6px; border-radius:6px; background:var(--crema-2); overflow:hidden}
  .secrow .sbar i{display:block; height:100%; border-radius:6px}
  .secrow .sv{font-family:var(--mono); font-size:10px; color:var(--ink-soft); width:32px; text-align:right}

  /* consejero / cartilla marcable */
  .prtop{display:flex; align-items:center; gap:14px; padding:15px 16px; border-bottom:1px solid var(--line)}
  .ring{position:relative; width:72px; height:72px; flex:none; border-radius:50%; background:conic-gradient(var(--oro) 0%,#e6dcc4 0); display:grid; place-items:center}
  .ring::before{content:""; position:absolute; inset:8px; background:var(--panel); border-radius:50%}
  .ring b{position:relative; font-family:var(--mono); font-weight:700; font-size:16px}
  .prtop .meta .k{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}
  .prtop .meta h3{font-family:var(--disp); font-weight:800; font-size:21px; margin:2px 0 3px}
  .prtop .meta p{margin:0; font-size:12px; color:var(--ink-soft)}
  .secblk{padding:12px 16px; border-top:1px solid var(--line)}
  .sechd{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
  .sechd b{font-size:13px; font-weight:600}
  .sechd .av-tag{font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; color:var(--ambar); background:rgba(224,138,0,.12); padding:2px 6px; border-radius:5px; margin-left:6px}
  .sechd .sp{font-family:var(--mono); font-size:11px; color:var(--ink-soft)}
  .secbar{height:6px; border-radius:6px; background:var(--crema-2); overflow:hidden; margin-bottom:9px}
  .secbar i{display:block; height:100%; background:var(--verde); border-radius:6px; transition:width .25s}
  .rq{display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:9px; font-size:12.5px; background:#fff; border:1px solid var(--line); margin-bottom:5px}
  .rq.ed{cursor:pointer}
  .rq.ed:hover{border-color:var(--verde)}
  .rq .chk{width:20px; height:20px; border-radius:6px; flex:none; border:2px solid #c9bfa4; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:800; margin-top:1px}
  .rq.isdone .chk{background:var(--verde); border-color:var(--verde)}
  .rq .chk.ro{border-radius:50%}
  .rq .rt{color:#45506a; line-height:1.4}
  .rq.isdone .rt{color:var(--ink)}
  .subrq{margin:5px 0 2px 30px; display:flex; flex-direction:column; gap:4px}
  .srq{display:flex; align-items:flex-start; gap:8px; font-size:11.5px; padding:6px 9px; border-radius:7px; background:#fbfaf6; border:1px solid var(--line)}
  .srq.ed{cursor:pointer}
  .srq .chk{width:16px; height:16px; border-radius:5px; border:2px solid #c9bfa4; display:grid; place-items:center; color:#fff; font-size:10px; font-weight:800; flex:none; margin-top:1px}
  .srq.isdone .chk{background:var(--verde); border-color:var(--verde)}
  .srq .lbl{font-weight:700; color:var(--ink-soft); flex:none}

  /* conquistador temático */
  #conq-hero{display:flex; align-items:center; gap:16px; padding:20px; border-radius:16px; color:#fff; margin-bottom:15px; position:relative; overflow:hidden}
  #conq-hero::after{content:""; position:absolute; right:-40px; top:-40px; width:170px; height:170px; border-radius:50%; background:rgba(255,255,255,.08)}
  #conq-hero .ring{position:relative; z-index:1}
  #conq-hero .ring::before{background:transparent}
  #conq-hero .ring b{color:#fff}
  #conq-hero .eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.8)}
  #conq-hero h2{font-family:var(--disp); font-weight:900; font-size:32px; margin:2px 0 4px; line-height:.9}
  #conq-hero p{margin:0; font-size:12px; color:rgba(255,255,255,.9)}
  body.conq-theme .secbar i, body.conq-theme .rq.isdone .chk, body.conq-theme .srq.isdone .chk{background:var(--theme)!important; border-color:var(--theme)!important}

  /* modal */
  .modal-bg{position:fixed; inset:0; z-index:60; background:rgba(7,16,36,.55); display:flex; align-items:center; justify-content:center; padding:18px}
  .modal{background:var(--panel); border-radius:16px; width:100%; max-width:380px; overflow:hidden; box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
  .modal h3{font-family:var(--disp); font-weight:800; font-size:18px; margin:0; padding:16px 18px 12px; border-bottom:1px solid var(--line)}
  .modal .body{padding:16px 18px}
  .modal label{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 5px 2px}
  .modal .mfield{margin-bottom:12px}
  .modal input, .modal select{width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-family:var(--body); font-size:14px; background:#fff; color:var(--ink)}
  .modal .foot{display:flex; gap:9px; padding:0 18px 18px}
  .modal .foot .btn{flex:1; justify-content:center; padding:11px}
  .merr{color:var(--rojo-700); font-size:12px; min-height:15px; margin-top:2px}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:80; background:var(--navy-900); color:#fff; font-size:13px; padding:11px 18px; border-radius:11px; box-shadow:0 12px 30px -8px rgba(0,0,0,.5); opacity:0; transition:opacity .2s, transform .2s}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}

  .loginhint{font-family:var(--mono); font-size:8px; letter-spacing:.04em; color:#8fa3c8; text-transform:none; margin-left:6px}

  /* pestañas */
  .tabs{display:flex; gap:4px; margin:0 0 16px; border-bottom:1px solid var(--line); overflow-x:auto}
  .tab{background:none; border:none; padding:10px 15px; font-size:13px; font-weight:600; color:var(--ink-soft); border-bottom:2px solid transparent; white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink); border-bottom-color:var(--rojo)}

  /* zona (campo) */
  .chip-cls.zona{font-family:var(--disp); font-weight:800; font-size:14px; letter-spacing:.02em}
  .zdot{width:9px; height:9px; border-radius:50%; background:var(--oro); box-shadow:0 0 0 3px rgba(242,183,5,.2)}
  .clubrow{display:flex; align-items:center; gap:10px; padding:11px 15px; border-top:1px solid var(--line); background:#fff}
  .clubrow .cinfo{flex:1; min-width:0}
  .clubrow .cinfo b{font-size:13px; font-weight:600}
  .clubrow .cinfo span{display:block; font-size:11px; color:var(--ink-soft); font-family:var(--mono)}
  .mini.del{border-color:rgba(214,24,10,.35); color:var(--rojo-700); background:#fff; font-size:13px; padding:6px 9px; flex:none}
  .mini.del:hover{background:rgba(214,24,10,.08)}

  /* credenciales */
  .credwarn{padding:13px 15px; font-size:12.5px; color:#6a5a1e; background:rgba(242,183,5,.12); line-height:1.5}
  .credlist{display:block}
  .cred{display:flex; flex-direction:column; align-items:flex-end; font-family:var(--mono); line-height:1.3}
  .cred b{font-size:12.5px; color:var(--ink)}
  .cred span{font-size:10.5px; color:var(--ink-soft)}
  .mini.acc{border:none; background:linear-gradient(180deg,#3aa0e6,#1f7ae0); color:#fff; flex:none}

  /* acciones dentro del acordeón del director */
  .kacts{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line)}
  .noacc{font-size:11px; opacity:.6}

  /* bandas comunes / avanzada en la cartilla */
  .cart-band{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:12px 16px; margin-top:2px;
    font-family:var(--disp); font-weight:800; font-size:16px; letter-spacing:.03em; color:#fff}
  .cart-band small{font-family:var(--mono); font-weight:400; font-size:10px; letter-spacing:.02em; opacity:.92; text-align:right}
  .cart-band.com{background:linear-gradient(100deg,#2c536f,#17384d)}
  .cart-band.av{background:linear-gradient(100deg,var(--ambar),#9a5e00)}

  /* checkboxes de clases (modal consejero) */
  .chk-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px}
  .chk-line{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:500; color:var(--ink); text-transform:none; letter-spacing:0; margin:0}
  .chk-line input{width:auto; flex:none}
  .chk-line i{width:10px; height:10px; border-radius:50%; flex:none}
  .chk-line .edadtag{margin-left:auto; font-family:var(--mono); font-size:9px; color:var(--ink-soft)}

  /* caja de acceso opcional (modal conquistador) */

/* ---------- util ---------- */
const $=s=>document.querySelector(s);
const el=(t,p={})=>Object.assign(document.createElement(t),p);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iniciales=n=>String(n||'').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const claseInfo=id=>CARTILLAS.clases.find(c=>c.id===id);
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2300); }
function loginErr(m,ok){ const e=$('#login-err'); e.style.color=ok?'#9fe3b0':''; e.textContent=m; }
function credErr(e){
  if(e.code==='auth/email-already-in-use') return 'Ese usuario ya existe, elige otro.';
  if(e.code==='auth/weak-password') return 'La contraseña debe tener mínimo 6 caracteres.';
  if(e.code==='auth/network-request-failed') return 'Sin conexión. Revisa tu internet.';
  return 'No se pudo guardar. Intenta de nuevo.';
}
function nombresClases(ids){ return (ids||[]).map(id=>{const c=claseInfo(id);return c?c.nombre:'';}).filter(Boolean).join(', '); }
function mensajeAnimo(pct){
  if(pct>=100) return '¡Cartilla completa! Listo para tu investidura 🎉';
  if(pct>=76)  return '¡Ya casi lo logras, excelente trabajo! 🌟';
  if(pct>=51)  return '¡Lo estás logrando, sigue firme! 🔥';
  if(pct>=26)  return '¡Vas muy bien, no te detengas! 💪';
  if(pct>=1)   return '¡Buen comienzo, tú puedes lograrlo!';
  return '¡Comienza tu aventura, tú puedes! 🚩';
}

/* progreso */
const hojas=r=>(r.subrequisitos&&r.subrequisitos.length)?r.subrequisitos.map(s=>s.id):[r.id];
function progSec(sec,p){ let t=0,d=0; sec.requisitos.forEach(r=>hojas(r).forEach(id=>{t++; if(p&&p[id])d++;})); return {total:t,done:d,pct:t?Math.round(d/t*100):0}; }
function progClase(cid,p){ const c=claseInfo(cid); let t=0,d=0; if(c)c.secciones.forEach(s=>{const x=progSec(s,p);t+=x.total;d+=x.done;}); return {total:t,done:d,pct:t?Math.round(d/t*100):0}; }

/* ---------- estado + listeners en vivo ---------- */
let SESSION=null;
const state={clubes:[],usuarios:[],conquistadores:[]};
let unsub=[];
let CAMPO_TAB='panel', CLUB_TAB='gestion';
function clearListeners(){ unsub.forEach(f=>{try{f()}catch(e){}}); unsub=[]; }
function setupListeners(){
  clearListeners(); state.clubes=[]; state.usuarios=[]; state.conquistadores=[];
  const mapDocs=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  const addCol=(q,fn)=>unsub.push(onSnapshot(q, s=>{ fn(mapDocs(s)); render(); }, e=>console.warn(e)));
  const addDoc1=(ref,fn)=>unsub.push(onSnapshot(ref, snap=>{ fn(snap.exists()?[{id:snap.id,...snap.data()}]:[]); render(); }, e=>console.warn(e)));
  if(SESSION.rol==='campo'){
    addCol(collection(db,'clubes'), r=>state.clubes=r);
    addCol(collection(db,'usuarios'), r=>state.usuarios=r);
    addCol(collection(db,'conquistadores'), r=>state.conquistadores=r);
  } else if(SESSION.rol==='club'){
    const cid=SESSION.clubId;
    addDoc1(doc(db,'clubes',cid), r=>state.clubes=r);
    addCol(query(collection(db,'usuarios'),where('clubId','==',cid)), r=>state.usuarios=r);
    addCol(query(collection(db,'conquistadores'),where('clubId','==',cid)), r=>state.conquistadores=r);
  } else if(SESSION.rol==='consejero'){
    addDoc1(doc(db,'clubes',SESSION.clubId), r=>state.clubes=r);
    addCol(query(collection(db,'conquistadores'),where('consejeroId','==',SESSION.id)), r=>state.conquistadores=r);
  } else if(SESSION.rol==='conquistador'){
    addDoc1(doc(db,'conquistadores',SESSION.id), r=>state.conquistadores=r);
  }
}

/* ================= AUTENTICACIÓN ================= */
let suppressAuth=false;
onAuthStateChanged(auth, async fbUser=>{
  if(suppressAuth) return;
  if(!fbUser){ showLoginScreen(); return; }
  try{ await afterAuth(fbUser); }catch(e){ console.error(e); loginErr('Ocurrió un error al entrar. Intenta de nuevo.'); try{await signOut(auth)}catch(_){ } }
});

async function afterAuth(fbUser){
  const uid=fbUser.uid;
  let snap=await getDoc(doc(db,'usuarios',uid));
  if(snap.exists()){
    const p=snap.data();
    if(p.estado==='pendiente'){ await signOut(auth); loginErr('Tu cuenta está pendiente de aprobación por el director de campo.'); return; }
    if(p.estado==='rechazado'){ await signOut(auth); loginErr('Tu solicitud fue rechazada. Contacta al director de campo.'); return; }
    SESSION={id:uid, ...p}; setupListeners(); enterApp(); return;
  }
  /* conquistador: primero por id = uid (modelo antiguo), luego por campo authUid (modelo nuevo) */
  snap=await getDoc(doc(db,'conquistadores',uid));
  if(snap.exists()){ SESSION={id:uid, rol:'conquistador', ...snap.data()}; setupListeners(); enterApp(); return; }
  const qs=await getDocs(query(collection(db,'conquistadores'),where('authUid','==',uid)));
  if(!qs.empty){ const d=qs.docs[0]; SESSION={id:d.id, rol:'conquistador', ...d.data()}; setupListeners(); enterApp(); return; }
  await signOut(auth); loginErr('No encontramos tu perfil. Pídele a tu director que te registre.');
}

async function doLogin(){
  const u=$('#li-user').value.trim().toLowerCase(), p=$('#li-pass').value;
  loginErr('');
  if(!u||!p){ loginErr('Escribe tu usuario y contraseña.'); return; }
  // bootstrap del director de campo: primera vez crea la cuenta 'campo'
  if(u==='campo'){
    try{ await signInWithEmailAndPassword(auth, emailOf(u), p); return; }
    catch(e){
      try{
        const cred=await createUserWithEmailAndPassword(auth, emailOf(u), p);
        await setDoc(doc(db,'usuarios',cred.user.uid), {usuario:'campo', rol:'campo', nombre:'Director de campo', estado:'activo'});
        return; // onAuthStateChanged entra solo
      }catch(e2){
        if(e2.code==='auth/email-already-in-use'){ loginErr('Contraseña incorrecta.'); }
        else if(e2.code==='auth/weak-password'){ loginErr('La contraseña debe tener mínimo 6 caracteres.'); }
        else{ loginErr('No se pudo iniciar. Revisa tu conexión.'); }
        return;
      }
    }
  }
  try{ await signInWithEmailAndPassword(auth, emailOf(u), p); }
  catch(e){
    if(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found') loginErr('Usuario o contraseña incorrectos.');
    else if(e.code==='auth/network-request-failed') loginErr('Sin conexión. Revisa tu internet.');
    else loginErr('No se pudo entrar. Intenta de nuevo.');
  }
}

async function doRegister(){
  const nombre=$('#rg-nombre').value.trim(), club=$('#rg-club').value.trim();
  const distrito=$('#rg-distrito').value.trim(), zona=$('#rg-zona').value.trim(), asociacion=$('#rg-asoc').value.trim();
  const user=$('#rg-user').value.trim().toLowerCase(), pass=$('#rg-pass').value;
  const err=$('#reg-err'); err.textContent='';
  if(!nombre||!club||!distrito||!zona||!asociacion||!user||!pass){ err.textContent='Completa todos los campos (incluida la zona).'; return; }
  if(user==='campo'){ err.textContent='Ese usuario está reservado, elige otro.'; return; }
  if(pass.length<6){ err.textContent='La contraseña debe tener mínimo 6 caracteres.'; return; }
  err.textContent='Creando tu cuenta…';
  suppressAuth=true;
  try{
    const cred=await createUserWithEmailAndPassword(auth, emailOf(user), pass);
    const uid=cred.user.uid, clubId='c_'+uid.slice(0,10);
    await setDoc(doc(db,'clubes',clubId), {nombre:club, distrito, zona, asociacion, directorId:uid});
    await setDoc(doc(db,'usuarios',uid), {usuario:user, pass, rol:'club', nombre, estado:'pendiente', clubId});
    await signOut(auth);
    suppressAuth=false;
    showLogin();
    loginErr('¡Cuenta creada! Queda pendiente de aprobación del director de campo.', true);
  }catch(e){
    suppressAuth=false;
    if(e.code==='auth/email-already-in-use') err.textContent='Ese usuario ya existe, elige otro.';
    else if(e.code==='auth/weak-password') err.textContent='La contraseña debe tener mínimo 6 caracteres.';
    else if(e.code==='auth/network-request-failed') err.textContent='Sin conexión. Revisa tu internet.';
    else err.textContent='No se pudo crear la cuenta. Intenta de nuevo.';
  }
}

async function crearCuenta(usuario, pass){
  // crea cuenta en la app secundaria y devuelve su uid (no afecta la sesión actual)
  const cred=await createUserWithEmailAndPassword(auth2, emailOf(usuario), pass);
  const uid=cred.user.uid;
  await signOut(auth2);
  return uid;
}

function doLogout(){ clearListeners(); signOut(auth); }

function rolLabel(u){
  if(u.rol==='campo') return 'Director de campo';
  if(u.rol==='club'){ const c=state.clubes.find(x=>x.id===u.clubId); return 'Director · '+(c?c.nombre:''); }

  if(u.rol==='conquistador'){ const ci=claseInfo(u.clase); return 'Conquistador · '+(ci?ci.nombre:''); }
  return '';
}
function enterApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#me-name').textContent=SESSION.nombre||'';
  $('#me-av').textContent=iniciales(SESSION.nombre);

function render(){
  if(!SESSION) return;
  document.body.className = SESSION.rol==='conquistador' ? 'conq-theme' : '';
  $('#me-role').textContent=rolLabel(SESSION);
  if(SESSION.rol==='campo') return renderCampo();

  if(SESSION.rol==='conquistador') return renderConquistador();
}

/* barra de pestañas reutilizable */
function tabBar(defs, current, onPick){
  const bar=el('div',{className:'tabs'});
  defs.forEach(([key,label])=>{
    const b=el('button',{className:'tab'+(key===current?' on':''), textContent:label});
    b.onclick=()=>onPick(key); bar.appendChild(b);
  });
  return bar;
}

function campoCred(body){
  const clubes=state.clubes;
  if(!clubes.length){ body.innerHTML='<div class="card"><div class="empty">Aún no hay clubes.</div></div>'; return; }
  const info=el('div',{className:'card'});
  info.innerHTML='<div class="credwarn">🔒 Usuarios y contraseñas de cada club. Esta información es privada: consérvala con cuidado.</div>';
  body.appendChild(info);
  clubes.forEach(c=>{
    const dir=state.usuarios.find(u=>u.id===c.directorId);
    const cons=state.usuarios.filter(u=>u.rol==='consejero'&&u.clubId===c.id);
    const qs=state.conquistadores.filter(q=>q.clubId===c.id);

    cons.forEach(u=>credRow(list, u.nombre, 'Consejero · '+(nombresClases(u.clases)||'sin clases'), u.usuario, u.pass));

function credRow(container, nombre, tipo, usuario, pass, onAcceso){
  const row=el('div',{className:'sol'});
  const right = usuario
    ? `<span class="cred"><b>${esc(usuario)}</b><span>clave: ${esc(pass||'—')}</span></span>`
    : (onAcceso?`<button class="mini acc">+ Crear acceso</button>`:`<span class="cred"><span>sin acceso</span></span>`);
  row.innerHTML=`<div class="av2">${iniciales(nombre)}</div><div class="info"><b>${esc(nombre)}</b><span>${esc(tipo)}</span></div>${right}`;

async function eliminarClub(cid, nombre){
  if(!confirm('¿Eliminar el club "'+nombre+'"?\n\nSe borrarán también su director, consejeros y conquistadores con todo su progreso. Esta acción no se puede deshacer.')) return;
  try{
    for(const u of state.usuarios.filter(u=>u.clubId===cid)) await deleteDoc(doc(db,'usuarios',u.id));
    for(const q of state.conquistadores.filter(q=>q.clubId===cid)) await deleteDoc(doc(db,'conquistadores',q.id));
    await deleteDoc(doc(db,'clubes',cid));
    toast('Club eliminado');
  }catch(e){ console.error(e); toast('No se pudo eliminar. Revisa tu conexión.'); }
}

/* tarjeta de cartilla (con separación comunes / avanzada) */
function cartillaCard(q, editable){
  const ci=claseInfo(q.clase); const prog=q.progreso||(q.progreso={});
  const gp=progClase(q.clase,prog);
  const card=el('div',{className:'card'});
  card.innerHTML=`<div class="prtop"><div class="ring"><b>${gp.pct}%</b></div>
    <div class="meta"><div class="k">Avance de la cartilla</div><h3>${ci.nombre}</h3><p>${gp.done} de ${gp.total} cumplidos · ${esc(q.nombre)}</p></div></div>`;
  card.querySelector('.ring').style.background=`conic-gradient(var(--oro) ${gp.pct}%, #e6dcc4 0)`;

  const comunes=ci.secciones.filter(s=>!s.avanzada);
  const avanzadas=ci.secciones.filter(s=>s.avanzada);
  const banda=(txt,sub,cls)=>el('div',{className:'cart-band '+cls,innerHTML:`<span>${txt}</span><small>${sub}</small>`});

  if(comunes.length){
    let gt=0,gd=0; comunes.forEach(s=>{const sp=progSec(s,prog); gt+=sp.total; gd+=sp.done;});
    card.appendChild(banda('Requisitos comunes', `${gt?Math.round(gd/gt*100):0}% · obligatorios para todos`, 'com'));
    comunes.forEach(sec=>card.appendChild(seccionBlk(sec,prog,q,editable)));
  }
  if(avanzadas.length){
    let gt=0,gd=0; avanzadas.forEach(s=>{const sp=progSec(s,prog); gt+=sp.total; gd+=sp.done;});
    card.appendChild(banda('Requisitos de avanzada', `${gt?Math.round(gd/gt*100):0}% · para la clase avanzada`, 'av'));
    avanzadas.forEach(sec=>card.appendChild(seccionBlk(sec,prog,q,editable)));
  }
  return card;
}
function seccionBlk(sec,prog,q,editable){
  const sp=progSec(sec,prog); const blk=el('div',{className:'secblk'});
  blk.innerHTML=`<div class="sechd"><b>${esc(sec.nombre)}</b><span class="sp">${sp.pct}%</span></div><div class="secbar"><i style="width:${sp.pct}%"></i></div>`;
  sec.requisitos.forEach(r=>{
    if(r.subrequisitos&&r.subrequisitos.length){
      const all=r.subrequisitos.every(s=>prog[s.id]);
      const padre=el('div',{className:'rq'+(all?' isdone':'')});
      padre.innerHTML=`<span class="chk ${editable?'':'ro'}">${all?'✓':''}</span><span class="rt">${esc(r.texto)}</span>`;
      blk.appendChild(padre);
      const sw=el('div',{className:'subrq'});
      r.subrequisitos.forEach(s=>{ const on=!!prog[s.id]; const sr=el('div',{className:'srq'+(on?' isdone':'')+(editable?' ed':'')});
        sr.innerHTML=`<span class="chk">${on?'✓':''}</span><span class="lbl">${esc(s.etiqueta)})</span><span class="rt">${esc(s.texto)}</span>`;
        if(editable) sr.onclick=()=>toggle(q,s.id); sw.appendChild(sr); });
      blk.appendChild(sw);
    } else {
      const on=!!prog[r.id]; const row=el('div',{className:'rq'+(on?' isdone':'')+(editable?' ed':'')});
      row.innerHTML=`<span class="chk ${editable?'':'ro'}">${on?'✓':''}</span><span class="rt">${esc(r.texto)}</span>`;
      if(editable) row.onclick=()=>toggle(q,r.id); blk.appendChild(row);
    }
  });
  return blk;
}
function toggle(q,id){
  q.progreso=q.progreso||{}; q.progreso[id]=!q.progreso[id];
  render(); // optimista
  updateDoc(doc(db,'conquistadores',q.id),{['progreso.'+id]: q.progreso[id]}).catch(e=>{ console.error(e); toast('No se pudo guardar. Revisa tu conexión.'); });
}

/* ================= CONQUISTADOR ================= */
function renderConquistador(){
  const v=$('#view');
  const q=state.conquistadores.find(x=>x.id===SESSION.id)||SESSION;
  const ci=claseInfo(q.clase); if(!ci){ v.innerHTML='<div class="card"><div class="empty">Cargando…</div></div>'; return; }
  document.body.style.setProperty('--theme', ci.color);
  const gp=progClase(q.clase,q.progreso||{});
  v.innerHTML=`<div class="phead"><div><h1>Mi progreso</h1><p>${esc(q.nombre)}</p></div><span class="rolechip">Solo lectura</span></div>`;
  const hero=el('div',{id:'conq-hero'});
  hero.style.background=`linear-gradient(135deg, ${ci.color}, color-mix(in srgb, ${ci.color} 60%, #10131a))`;
  hero.innerHTML=`<div class="ring"><b>${gp.pct}%</b></div>
    <div class="hinfo"><div class="eyebrow">Mi clase</div><h2>${ci.nombre}</h2>
      <p>${gp.done} de ${gp.total} requisitos cumplidos</p>
      <div class="animo">${mensajeAnimo(gp.pct)}</div></div>`;
  hero.querySelector('.ring').style.background=`conic-gradient(#fff ${gp.pct}%, rgba(255,255,255,.28) 0)`;
  v.appendChild(hero); v.appendChild(cartillaCard(q,false));
}

/* ================= MODALES ================= */
function modal(html){ $('#modal-root').innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`;
  $('#modal-root .modal-bg').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeModal(); }); }
function closeModal(){ $('#modal-root').innerHTML=''; }

function modalConq(){
  const opts=CARTILLAS.clases.map(c=>`<option value="${c.id}">${c.nombre} (${c.edad} años)</option>`).join('');
  const cons=state.usuarios.filter(u=>u.rol==='consejero');
  const copt='<option value="">— Sin asignar por ahora —</option>'+cons.map(c=>`<option value="${c.id}">${esc(c.nombre)}${c.clases&&c.clases.length?' ('+esc(nombresClases(c.clases))+')':''}</option>`).join('');
  modal(`<h3>Agregar conquistador</h3><div class="body">
    <div class="mfield"><label>Nombre completo</label><input id="m-nombre" placeholder="Nombre del niño/a"></div>
    <div class="mfield"><label>Clase</label><select id="m-clase">${opts}</select></div>
    <div class="mfield"><label>Consejero</label><select id="m-cons">${copt}</select></div>
    <div class="credbox">
      <div class="credbox-tit">Acceso del conquistador <span class="hint">opcional · lo puedes crear después</span></div>
      <div class="mfield"><label>Usuario</label><input id="m-user" placeholder="usuario para el niño (opcional)"></div>
      <div class="mfield"><label>Contraseña <span class="hint">mínimo 6 caracteres</span></label><input id="m-pass" placeholder="contraseña (opcional)"></div>
    </div>
    <div class="merr" id="m-err"></div></div>
    <div class="foot"><button class="btn ghost" id="m-cancel">Cancelar</button><button class="btn red" id="m-ok">Agregar</button></div>`);
  $('#m-cancel').onclick=closeModal; $('#m-ok').onclick=saveConq;
}
async function saveConq(){
  const nombre=$('#m-nombre').value.trim(), clase=$('#m-clase').value, consId=$('#m-cons').value;
  const user=$('#m-user').value.trim().toLowerCase(), pass=$('#m-pass').value; const err=$('#m-err');
  if(!nombre){ err.textContent='Escribe el nombre del conquistador.'; return; }
  const quiereAcceso = user||pass;
  if(quiereAcceso){
    if(!user||!pass){ err.textContent='Para crear acceso escribe usuario y contraseña (o deja ambos vacíos).'; return; }
    if(pass.length<6){ err.textContent='La contraseña debe tener mínimo 6 caracteres.'; return; }
  }
  err.textContent='Guardando…'; $('#m-ok').disabled=true;
  try{
    const data={nombre, clase, clubId:SESSION.clubId, consejeroId:consId||null, progreso:{}};
    if(quiereAcceso){ const uid=await crearCuenta(user,pass); data.usuario=user; data.pass=pass; data.authUid=uid; }
    await addDoc(collection(db,'conquistadores'), data);
    closeModal(); toast(quiereAcceso?'Conquistador agregado con acceso':'Conquistador agregado (sin acceso aún)');
  }catch(e){ $('#m-ok').disabled=false; err.textContent=credErr(e); }
}

function modalAcceso(q){
  modal(`<h3>Crear acceso</h3><div class="body">
    <p class="mnote">Acceso para <b>${esc(q.nombre)}</b> para que entre a ver su cartilla.</p>
    <div class="mfield"><label>Usuario</label><input id="a-user" placeholder="usuario del niño" value="${esc(q.usuario||'')}"></div>
    <div class="mfield"><label>Contraseña <span class="hint">mínimo 6 caracteres</span></label><input id="a-pass" placeholder="contraseña"></div>
    <div class="merr" id="a-err"></div></div>
    <div class="foot"><button class="btn ghost" id="a-cancel">Cancelar</button><button class="btn red" id="a-ok">Guardar acceso</button></div>`);
  $('#a-cancel').onclick=closeModal; $('#a-ok').onclick=()=>guardarAcceso(q);
}
async function guardarAcceso(q){
  const user=$('#a-user').value.trim().toLowerCase(), pass=$('#a-pass').value; const err=$('#a-err');
  if(!user||!pass){ err.textContent='Escribe usuario y contraseña.'; return; }
  if(pass.length<6){ err.textContent='La contraseña debe tener mínimo 6 caracteres.'; return; }
  err.textContent='Guardando…'; $('#a-ok').disabled=true;
  try{
    const uid=await crearCuenta(user,pass);
    await updateDoc(doc(db,'conquistadores',q.id),{usuario:user, pass, authUid:uid});
    closeModal(); toast('Acceso creado');
  }catch(e){ $('#a-ok').disabled=false; err.textContent=credErr(e); }
}

function modalConsejero(){
  const checks=CARTILLAS.clases.map(c=>`<label class="chk-line"><input type="checkbox" value="${c.id}"> <i style="background:${c.color}"></i>${c.nombre} <span class="edadtag">${c.edad} años</span></label>`).join('');
  modal(`<h3>Agregar consejero</h3><div class="body">
    <div class="mfield"><label>Nombre completo</label><input id="m-nombre" placeholder="Nombre del consejero"></div>
    <div class="mfield"><label>Clase(s) que dirige <span class="hint">marca una o varias</span></label>
      <div class="chk-grid" id="m-clases">${checks}</div></div>
    <div class="mfield"><label>Usuario</label><input id="m-user" placeholder="usuario"></div>
    <div class="mfield"><label>Contraseña <span class="hint">mínimo 6 caracteres</span></label><input id="m-pass" placeholder="contraseña"></div>
    <div class="merr" id="m-err"></div></div>
    <div class="foot"><button class="btn ghost" id="m-cancel">Cancelar</button><button class="btn gold" id="m-ok">Agregar</button></div>`);
  $('#m-cancel').onclick=closeModal; $('#m-ok').onclick=saveConsejero;
}
async function saveConsejero(){
  const nombre=$('#m-nombre').value.trim(), user=$('#m-user').value.trim().toLowerCase(), pass=$('#m-pass').value; const err=$('#m-err');
  const clases=[...document.querySelectorAll('#m-clases input:checked')].map(i=>i.value);
  if(!nombre||!user||!pass){ err.textContent='Completa nombre, usuario y contraseña.'; return; }
  if(!clases.length){ err.textContent='Marca al menos una clase que va a dirigir.'; return; }
  if(pass.length<6){ err.textContent='La contraseña debe tener mínimo 6 caracteres.'; return; }
  err.textContent='Guardando…'; $('#m-ok').disabled=true;
  try{
    const uid=await crearCuenta(user,pass);
    await setDoc(doc(db,'usuarios',uid), {usuario:user, pass, rol:'consejero', nombre, estado:'activo', clubId:SESSION.clubId, clases});
    closeModal(); toast('Consejero agregado');
  }catch(e){ $('#m-ok').disabled=false; err.textContent=credErr(e); }
}
